[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privacyguard-ai"
version = "0.1.0"
description = "AI-powered personal data deletion audit agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "pydantic>=2.7",
    "pypdf>=7.0",
    "pillow>=13.0",
    "psycopg[binary]>=3.2,<4",
    "psycopg2-binary>=2.9,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
privacyguard = "privacyguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"privacyguard.evidence.ocr" = ["*.ps1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
